; DeskBuddy v2 — ESP32 WROOM DevKit
; Arduino framework, pinned platform, custom OTA partition table.

[platformio]
src_dir = src
; Build/Upload buttons use USB only. For wireless: pio run -e ota -t upload
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0      ; Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, send_on_enter
monitor_echo = yes            ; show what you type in the serial monitor
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_LOOP_STACK_SIZE=8192

lib_deps =
    olikraus/U8g2@^2.35.30
    bblanchon/ArduinoJson@^6.21.5
    tzapu/WiFiManager@^2.0.17
    mathertel/OneButton@^2.5.0
    links2004/WebSockets@^2.4.1

; Wireless upload after the first USB flash:  pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = deskbuddy.local
